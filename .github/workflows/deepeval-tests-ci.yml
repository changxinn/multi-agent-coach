name: DeepEval Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deepeval-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deepeval:
    # Dependabot cannot access the required paid API secret.
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INTERNAL_SERVICE_TOKEN: ci-deepeval-local-token
      DEEPEVAL_JUDGE_MODEL: ${{ vars.DEEPEVAL_JUDGE_MODEL || 'gpt-4.1-mini' }}
      DEEPEVAL_TELEMETRY_OPT_OUT: 'YES'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: deepeval-tests/requirements.txt
      - name: Check required secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Add the OPENAI_API_KEY repository secret to run DeepEval.'
            exit 1
          fi
      - name: Install evaluation dependencies
        run: python -m pip install -r deepeval-tests/requirements.txt
      - name: Build and start agent services
        run: docker compose up --build -d --wait --wait-timeout 180 head-coach summarizer
      - name: Run routing, safety and summary evaluations
        working-directory: deepeval-tests
        run: python -m pytest . -v --junitxml=results/junit.xml
      - name: Upload evaluation results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: deepeval-results
          path: deepeval-tests/results/
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color head-coach summarizer
      - name: Tear down services
        if: always()
        run: docker compose down
