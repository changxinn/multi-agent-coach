name: Promptfoo Tests

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: promptfoo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  promptfoo:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      INTERNAL_SERVICE_TOKEN: ci-promptfoo-local-token
      RECOVERY_DB_PASSWORD: ${{ secrets.RECOVERY_DB_PASSWORD }}
      TRAINING_DB_PASSWORD: ${{ secrets.TRAINING_DB_PASSWORD }}
      PROMPTFOO_DISABLE_TELEMETRY: '1'
      PROMPTFOO_DISABLE_UPDATE: '1'
      REQUEST_TIMEOUT_MS: '180000'

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check required secret
        run: |
          if [ -z "$OPENAI_API_KEY" ]; then
            echo '::error::Add the OPENAI_API_KEY repository secret to run live evaluations.'
            exit 1
          fi
      - name: Install Promptfoo
        shell: bash
        run: |
          npm install --global promptfoo@0.120.0
          # 0.120.0 resolves drizzle/ on Linux but ships migrations in dist/drizzle/.
          promptfoo_root="$(npm root --global)/promptfoo"
          if [ ! -f "$promptfoo_root/drizzle/meta/_journal.json" ]; then
            test -f "$promptfoo_root/dist/drizzle/meta/_journal.json"
            mkdir -p "$promptfoo_root/drizzle"
            cp -R "$promptfoo_root/dist/drizzle/." "$promptfoo_root/drizzle/"
          fi
          test -f "$promptfoo_root/drizzle/meta/_journal.json"
      - name: Build and start agent services
        run: docker compose up --build -d --wait --wait-timeout 180 head-coach summarizer
      - name: Run all four evaluation suites
        env:
          PROMPTFOO_CONFIG_DIR: ${{ runner.temp }}/promptfoo
        working-directory: promptfoo-tests
        shell: bash
        run: |
          mkdir -p results
          failed=0
          for suite in routing safety session-summary daily-summary; do
            echo "::group::$suite"
            if ! promptfoo eval -c "$suite.yaml" --no-cache --no-share --no-write --max-concurrency 1 --output "results/$suite.json" "results/$suite.html"; then
              failed=1
            fi
            echo '::endgroup::'
          done
          exit "$failed"
      - name: Upload evaluation reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promptfoo-results
          path: promptfoo-tests/results/
          if-no-files-found: ignore
      - name: Show service logs on failure
        if: failure()
        run: docker compose logs --no-color head-coach summarizer
      - name: Tear down services
        if: always()
        run: docker compose down
