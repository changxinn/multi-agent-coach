name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: systemdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d systemdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nutrition-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nutritiondb
          POSTGRES_USER: nutrition_agent
          POSTGRES_PASSWORD: nutrition-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nutrition_agent -d nutritiondb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/systemdb
      NUTRITION_INTEGRATION_DATABASE_URL: postgresql+asyncpg://nutrition_agent:nutrition-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5433/nutritiondb
      INTERNAL_SERVICE_TOKEN: ci-test-internal-service-token
      OPENAI_API_KEY: ci-test-openai-key
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
      - name: Install backend dependencies
        run: uv sync --locked --all-groups --no-build
      - name: Run backend tests with coverage
        run: uv run pytest -q --cov=app --cov-report=xml:coverage.xml
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts --registry=https://registry.npmjs.org/
      - name: Run frontend tests with coverage
        run: npm --prefix frontend run test:coverage
      - name: Cache SonarQube packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.organization=changxinn
            -Dsonar.projectKey=changxinn_multi-agent-coach
            -Dsonar.python.coverage.reportPaths=coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
