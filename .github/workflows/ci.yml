name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: systemdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d systemdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nutrition-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nutritiondb
          POSTGRES_USER: nutrition_agent
          POSTGRES_PASSWORD: nutrition-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nutrition_agent -d nutritiondb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://postgres:${{ github.run_id }}-${{ github.run_attempt }}@localhost:5432/systemdb
      NUTRITION_INTEGRATION_DATABASE_URL: postgresql+asyncpg://nutrition_agent:nutrition-${{ github.run_id }}-${{ github.run_attempt }}@localhost:5433/nutritiondb
      INTERNAL_SERVICE_TOKEN: ci-test-internal-service-token
      OPENAI_API_KEY: ci-test-openai-key

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups --no-build

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm --prefix frontend ci --ignore-scripts --registry=https://registry.npmjs.org/

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build
