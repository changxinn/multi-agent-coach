name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: systemdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d systemdb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      nutrition-postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nutritiondb
          POSTGRES_USER: nutrition_agent
          POSTGRES_PASSWORD: nutrition_agent
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U nutrition_agent -d nutritiondb"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      JWT_SECRET_KEY: ci-test-jwt-secret-not-for-production
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/systemdb
      NUTRITION_INTEGRATION_DATABASE_URL: postgresql+asyncpg://nutrition_agent:nutrition_agent@localhost:5433/nutritiondb
      INTERNAL_SERVICE_TOKEN: ci-test-internal-service-token
      OPENAI_API_KEY: ci-test-openai-key

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.16.0
          cache: npm
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        run: npm install --prefix frontend

      - name: Lint frontend
        run: npm --prefix frontend run lint

      - name: Build frontend
        run: npm --prefix frontend run build
