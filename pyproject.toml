[project]
name = "fitness-coach"
version = "0.1.0"
description = "Multi-agent fitness coaching system with LangGraph and FastAPI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    # LangGraph & LangChain
    "langchain>=0.3.27",
    "langchain-openai>=0.2.14",
    "langgraph>=0.6.6",
    
    # FastAPI & Web
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    
    # Database
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.0",
    
    # Authentication
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "python-multipart>=0.0.6",
    "email-validator>=2.0.0",
    
    # AWS (optional, for production)
    "boto3>=1.34.0",
    
    # Utilities
    "python-dotenv>=1.1.1",
    "pytz>=2025.2",
    "tzdata>=2025.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=6.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.11",
    "httpx>=0.27.0",  # For async testing
]

[tool.ruff.lint]
ignore = ["BLE001"]

[tool.ruff.lint.per-file-ignores]
"app/api/routes/*.py" = ["B008"]
"services/nutrition_agent/app/main.py" = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires an explicitly configured disposable PostgreSQL database",
]

[tool.setuptools.packages.find]
include = ["app*", "agents*", "tools*"]
exclude = ["frontend*", "tests*", "*.tests"]
