version: '3.8'

# ===========================================
# Docker Compose for Local Development
# ===========================================
# Services:
# - api: FastAPI backend
# - db: PostgreSQL database
# - redis: Redis cache (optional, for session testing)
# - recovery-agent, head-coach, summarizer, nutrition-agent: one image per agent
#
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose down            # Stop all services
#   docker-compose logs -f api     # View API logs
# ===========================================

services:
  # ===========================================
  # FastAPI Backend
  # ===========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/systemdb
      - DATABASE_SCHEMA=systemdb
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_HOURS=24
      - SESSION_EXPIRY_HOURS=24
      - FRONTEND_URL=http://localhost:5174
      - ALLOWED_ORIGINS=http://localhost:5174,http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=gpt-5-nano
      - USE_RECOVERY_AGENT_SERVICE=true
      - RECOVERY_AGENT_URL=http://recovery-agent:8001
      - USE_HEAD_COACH_SERVICE=true
      - HEAD_COACH_URL=http://head-coach:8002
      - USE_SUMMARIZER_SERVICE=true
      - SUMMARIZER_URL=http://summarizer:8003
      - USE_NUTRITION_AGENT_SERVICE=true
      - NUTRITION_AGENT_URL=http://nutrition-agent:8004
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-local-dev-recovery-token}
      - USDA_FDC_API_KEY=${USDA_FDC_API_KEY}
      - DEBUG=true
      - SEED_ADMIN_EMAIL=admin@example.com
      - SEED_ADMIN_PASSWORD=ChangeMe123!
      - SEED_ADMIN_NAME=System Admin
    volumes:
      - ./app:/app/app
      - ./agents:/app/agents
      - ./tools:/app/tools
      - ./state.py:/app/state.py
      - ./nodes.py:/app/nodes.py
      - ./display.py:/app/display.py
      - ./utils.py:/app/utils.py
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    user: "0:0"
    depends_on:
      db:
        condition: service_healthy
      head-coach:
        condition: service_started
      summarizer:
        condition: service_started
      nutrition-agent:
        condition: service_started
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - app-network

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=systemdb
      - POSTGRES_USER=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Redis (Optional - for session testing)
  # ===========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Recovery Agent Microservice
  # ===========================================
  recovery-agent:
    build:
      context: ./services/recovery_agent
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/systemdb
      - DATABASE_SCHEMA=systemdb
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-local-dev-recovery-token}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Head Coach Agent Microservice
  # ===========================================
  head-coach:
    build:
      context: .
      dockerfile: services/head_coach/Dockerfile
    ports:
      - "127.0.0.1:8002:8002"
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-local-dev-recovery-token}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=gpt-5-nano
      - HEAD_COACH_SERVICE_MODE=true
    volumes:
      - ./agents:/service/agents
      - ./display.py:/service/display.py
      - ./utils.py:/service/utils.py
      - ./services/head_coach/app:/service/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8002", "--reload"]
    user: "0:0"
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Summarizer Agent Microservice
  # ===========================================
  summarizer:
    build:
      context: .
      dockerfile: services/summarizer/Dockerfile
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-local-dev-recovery-token}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=gpt-5-nano
      - SUMMARIZER_SERVICE_MODE=true
    volumes:
      - ./agents:/service/agents
      - ./utils.py:/service/utils.py
      - ./display.py:/service/display.py
      - ./services/summarizer/app:/service/app
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8003", "--reload"]
    user: "0:0"
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Nutrition Agent Microservice
  # ===========================================
  nutrition-agent:
    build:
      context: .
      dockerfile: services/nutrition_agent/Dockerfile
    ports:
      - "127.0.0.1:8004:8004"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/systemdb
      - DATABASE_SCHEMA=systemdb
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-local-dev-recovery-token}
      - USDA_FDC_API_KEY=${USDA_FDC_API_KEY}
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # One-off USDA Food Catalogue Import
  # Run manually: docker compose run --rm nutrition-catalogue-import
  # ===========================================
  nutrition-catalogue-import:
    build:
      context: .
      dockerfile: services/nutrition_agent/Dockerfile
    profiles:
      - catalogue-import
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/systemdb
      - DATABASE_SCHEMA=systemdb
      - USDA_FDC_API_KEY=${USDA_FDC_API_KEY}
    depends_on:
      db:
        condition: service_healthy
    command: ["python", "import_usda_catalogue.py", "--all"]
    restart: "no"
    networks:
      - app-network

  # ===========================================
  # Frontend (Vite hot reload)
  # ===========================================
  frontend:
    image: node:20-alpine
    working_dir: /frontend
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 5174"
    ports:
      - "5174:5174"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend:/frontend
      - frontend_node_modules:/frontend/node_modules
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  frontend_node_modules:
    driver: local

networks:
  app-network:
    driver: bridge
