# ===========================================
# Docker Compose for Local Development
# ===========================================
# Services:
# - migrations: one-shot PostgreSQL schema migrator
# - api: FastAPI backend
# - db: PostgreSQL database
# - redis: Redis cache (optional, for session testing)
#
# Usage:
#   docker-compose up -d           # Start all services
#   docker-compose down            # Stop all services
#   docker-compose logs -f api     # View API logs
# ===========================================

services:
  # ===========================================
  # One-shot database migration job
  # ===========================================
  # Schema mutation is owned exclusively by this job. Runtime services only
  # validate the migration ledger and compatible schema during readiness.
  migrations:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["python", "-m", "app.db.migrate"]
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/systemdb
      - DATABASE_SCHEMA=systemdb
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    networks:
      - app-network

  # ===========================================
  # FastAPI Backend
  # ===========================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/systemdb
      - DATABASE_SCHEMA=systemdb
      - JWT_SECRET_KEY=dev-secret-key-change-in-production
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRY_HOURS=24
      - SESSION_EXPIRY_HOURS=24
      - FRONTEND_URL=http://localhost:5174
      - ALLOWED_ORIGINS=http://localhost:5174,http://localhost:3000
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLM_MODEL=gpt-5-nano
      - USE_RECOVERY_AGENT_SERVICE=true
      - RECOVERY_AGENT_URL=http://recovery-agent:8001
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-local-dev-recovery-token}
      - USE_NUTRITION_AGENT_SERVICE=true
      - NUTRITION_AGENT_URL=http://nutrition-agent:8003
      - NUTRITION_AGENT_ROLLOUT_PERCENT=${NUTRITION_AGENT_ROLLOUT_PERCENT:-0}
      - NUTRITION_INTERNAL_SERVICE_TOKEN=${NUTRITION_INTERNAL_SERVICE_TOKEN:-local-dev-nutrition-token}
      - DEBUG=true
      - SEED_ADMIN_EMAIL=admin@example.com
      - SEED_ADMIN_PASSWORD=ChangeMe123!
      - SEED_ADMIN_NAME=System Admin
    depends_on:
      migrations:
        condition: service_completed_successfully
    volumes:
      - ./app:/app/app  # Mount for hot reload
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # PostgreSQL Database
  # ===========================================
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=systemdb
      - POSTGRES_USER=postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Redis (Optional - for session testing)
  # ===========================================
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Recovery Agent Microservice
  # ===========================================
  recovery-agent:
    build:
      context: ./services/recovery_agent
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8001:8001"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/systemdb
      - DATABASE_SCHEMA=systemdb
      - INTERNAL_SERVICE_TOKEN=${INTERNAL_SERVICE_TOKEN:-local-dev-recovery-token}
    depends_on:
      db:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

  # ===========================================
  # Nutrition Agent Microservice
  # ===========================================
  nutrition-agent:
    build:
      context: ./services/nutrition_agent
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8003:8003"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/systemdb
      - DATABASE_SCHEMA=systemdb
      - NUTRITION_INTERNAL_SERVICE_TOKEN=${NUTRITION_INTERNAL_SERVICE_TOKEN:-local-dev-nutrition-token}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NUTRITION_LLM_ENABLED=false
      - USDA_FDC_API_KEY=${USDA_FDC_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
      migrations:
        condition: service_completed_successfully
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  app-network:
    driver: bridge
